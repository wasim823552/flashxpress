# ============================================================================
# FlashXpress WordPress NGINX Server Block Template
# ============================================================================
# Copy this template for each WordPress site and adjust:
#   - server_name (your domain)
#   - root (path to WordPress files)
#   - phpX.X-fpm.sock (PHP version)
# ============================================================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Let's Encrypt challenge
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/letsencrypt;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # SSL Configuration
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Site root
    root /var/www/example.com;
    index index.php index.html;

    # =====================================================
    # Security Headers
    # =====================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()" always;

    # =====================================================
    # FastCGI Cache Configuration
    # =====================================================
    set $skip_cache 0;

    # Skip cache for POST requests
    if ($request_method = POST) {
        set $skip_cache 1;
    }

    # Skip cache if there's a query string
    if ($query_string != "") {
        set $skip_cache 1;
    }

    # Skip cache for logged-in users and commenters
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in") {
        set $skip_cache 1;
    }

    # Skip cache for WordPress admin, API, and dynamic files
    if ($request_uri ~* "/wp-admin/|/xmlrpc.php|wp-.*.php|/feed/|index.php|sitemap(_index)?.xml") {
        set $skip_cache 1;
    }

    # Skip cache for WooCommerce
    if ($http_cookie ~* "woocommerce_items_in_cart|wp_woocommerce_session") {
        set $skip_cache 1;
    }

    # =====================================================
    # Logging
    # =====================================================
    access_log /var/log/nginx/example.com.access.log;
    error_log /var/log/nginx/example.com.error.log;

    # =====================================================
    # Main Location Block
    # =====================================================
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # =====================================================
    # PHP Handling with FastCGI Cache
    # =====================================================
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors on;

        # FastCGI Cache Settings
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        fastcgi_cache FLASHXPRESS;
        fastcgi_cache_valid 200 301 302 60m;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
        fastcgi_cache_lock on;
        fastcgi_cache_min_uses 1;

        # Add cache status header
        add_header X-FX-Cache $upstream_cache_status;

        # FastCGI timeouts
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # =====================================================
    # Static Files Caching
    # =====================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|mp4|webm|ogg|mp3|avi|mov|wmv|flv)$ {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # =====================================================
    # Security: Deny Access to Hidden Files
    # =====================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =====================================================
    # Security: Deny Access to Sensitive Files
    # =====================================================
    location ~* /(?:xmlrpc\.php|wp-config\.php|readme\.html|license\.txt|htaccess\.txt)$ {
        deny all;
    }

    # =====================================================
    # Security: Limit Upload Size
    # =====================================================
    client_max_body_size 256M;

    # =====================================================
    # Rate Limiting
    # =====================================================
    limit_req_zone $binary_remote_addr zone=fxlimit:10m rate=10r/s;

    location = /wp-login.php {
        limit_req zone=fxlimit burst=5 nodelay;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # =====================================================
    # Favicon and Robots
    # =====================================================
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
        try_files $uri /index.php?$args;
    }
}
