; ============================================================================
; FlashXpress PHP Security Configuration
; ============================================================================
; Disabled functions for enhanced WordPress security
; ============================================================================

disable_functions = exec,passthru,shell_exec,system,proc_open,popen,
curl_exec,curl_multi_exec,parse_ini_file,show_source,
phpinfo,posix_getpwuid,posix_getgrgid,posix_kill,
error_log,ini_set,ini_alter,ini_restore,dl,
putenv,getmypid,get_current_user,getmyuid

; Maximum execution time
max_execution_time = 300

; Maximum input time
max_input_time = 300

; Memory limit
memory_limit = 512M

; Upload settings
upload_max_filesize = 256M
post_max_size = 256M

; Security settings
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Session security
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_secure = 1
session.use_only_cookies = 1

; File uploads
file_uploads = On
max_file_uploads = 20

; CGI settings
cgi.fix_pathinfo = 0
