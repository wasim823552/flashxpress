# ============================================================================
# Fail2Ban Filter: NGINX Rate Limiting
# ============================================================================
# Matches NGINX rate limiting (limit_req) errors
# Used with the nginx-limit-req jail configuration
# ============================================================================

[Definition]

# Match NGINX rate limiting errors in error log
failregex = ^.*\[error\] \d+#\d+: \*\d+ limiting requests by zone ".*", client: <HOST>.*$

# Ignore these log entries
ignoreregex =

