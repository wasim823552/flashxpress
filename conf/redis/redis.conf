# ============================================================================
# FlashXpress Redis Configuration for WordPress Object Cache
# ============================================================================
# Optimized for WordPress Redis Object Cache plugin
# ============================================================================

# Network
bind 127.0.0.1 ::1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General
daemonize yes
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-server.log
databases 16

# Snapshotting (RDB) - Save to disk periodically
save 900 1
save 300 10
save 60 10000

# Disable RDB persistence for pure in-memory cache (faster)
# Uncomment the following line for pure object caching:
# save ""

# Stop writing to disk
stop-writes-on-bgsave-error no

# RDB file settings
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/redis

# Replication
replica-serve-stale-data yes
replica-read-only yes

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Lazy freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Security
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# Client limits
maxclients 10000

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency tracking
latency-monitor-threshold 0

# Append Only File (AOF) - Disabled for pure cache performance
appendonly no
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
